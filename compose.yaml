# Sallyport MVP stack: Pomerium (identity-aware proxy, only exposed service)
# in front of Apache Guacamole (clientless RDP/SSH gateway).
#
# Do not edit this file to configure a deployment. Edit sallyport.yaml and
# targets.yaml, then run ./sallyport init (see README.md).
#
# MVP choices: floating "latest" tags (except Postgres, whose major version must
# not change underneath an existing data directory), no egress restriction, no
# log forwarding, no session recording.

name: sallyport

services:
  pomerium:
    image: pomerium/pomerium:latest
    restart: unless-stopped
    environment:
      SHARED_SECRET: ${SHARED_SECRET:?run ./sallyport init first}
      COOKIE_SECRET: ${COOKIE_SECRET:?run ./sallyport init first}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET:?run ./sallyport init first}
      # Pomerium signs each user's identity for the admin site with this key.
      SIGNING_KEY: ${SIGNING_KEY:?run ./sallyport init first}
    volumes:
      - ./generated/pomerium.yaml:/pomerium/config.yaml:ro
      - pomerium-data:/data # ACME account and certificates
    ports:
      - "80:80" # ACME HTTP-01 challenge and redirect to HTTPS
      - "443:443"
    networks: [edge, internal]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - guacamole
      - admin

  # The admin site (targets editor). Reachable only through Pomerium's admin route, which has its
  # own allow-list. It verifies Pomerium's signed identity on every request.
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: sallyport-admin:local
    restart: unless-stopped
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?run ./sallyport init first}
      DB_HOST: postgres
      DB_NAME: guacamole_db
      DB_USER: sallyport_admin
      DB_PASSWORD: ${ADMIN_DB_PASSWORD:?run ./sallyport init first}
      JWT_PUBLIC_KEY: /app/jwt.pub
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      MAIN_HOST: ${MAIN_HOST:-}
    volumes:
      - ./generated/admin-jwt.pub:/app/jwt.pub:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    networks: [internal]
    security_opt:
      - no-new-privileges:true

  guacamole:
    image: guacamole/guacamole:latest
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_app
      POSTGRESQL_PASSWORD: ${GUAC_APP_PASSWORD:?run ./sallyport init first}
      # Create a database account the first time Pomerium vouches for a user.
      # (The Docker docs once spelled this POSTGRES_..., which does not work;
      # see GUACAMOLE-1572.) A trigger adds new accounts to "sallyport-users".
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: "true"
      # Trust the identity header set by Pomerium. Guacamole performs no check
      # of its own, so it must only be reachable via Pomerium (internal network).
      # Both spellings of the enable flag are set: the Docker image and the 1.6.0
      # manual differ, and an unused variable is harmless.
      HEADER_ENABLED: "true"
      HTTP_AUTH_ENABLED: "true"
      HTTP_AUTH_HEADER: X-Pomerium-Claim-Email
      WEBAPP_CONTEXT: ROOT
      REMOTE_IP_VALVE_ENABLED: "true"
    volumes:
      # Sallyport branding and the link to the admin site (built by ./sallyport init).
      - ./generated/sallyport-branding.jar:/etc/guacamole/extensions/sallyport-branding.jar:ro
    networks: [internal]
    security_opt:
      - no-new-privileges:true

  # Keeps <subdomain>.duckdns.org pointing at this server's current public address. Only runs when
  # dynamic_dns is set in sallyport.yaml (init sets COMPOSE_PROFILES=duckdns in .env). DuckDNS answers
  # for every name under your subdomain, so authenticate. and admin. need no records of their own.
  duckdns:
    profiles: [duckdns]
    image: curlimages/curl:latest
    restart: unless-stopped
    environment:
      SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          r=$$(curl -sS --max-time 30 "https://www.duckdns.org/update?domains=$$SUBDOMAIN&token=$$TOKEN&ip=" 2>&1 | head -c 200)
          echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) duckdns update: $$r"
          sleep 300
        done
    read_only: true
    cap_drop: [ALL]
    networks: [edge]
    security_opt:
      - no-new-privileges:true

  guacd:
    image: guacamole/guacd:latest
    restart: unless-stopped
    # The only container that talks to target systems. Apply host firewall rules
    # to this container's traffic once egress restriction is in scope.
    networks: [internal, targets]
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./sallyport init first}
      GUAC_APP_PASSWORD: ${GUAC_APP_PASSWORD:?run ./sallyport init first}
    volumes:
      # Schema and Sallyport setup scripts. These run only when the data volume
      # is first created (see README, "Upgrades").
      - ./generated/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_owner -d guacamole_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    security_opt:
      - no-new-privileges:true

networks:
  edge: {}
  internal:
    internal: true # no route to or from the outside world
  targets: {} # guacd only

volumes:
  pomerium-data:
  postgres-data:
