# Sallyport operator configuration. Copy to sallyport.yaml and edit.
# sallyport.yaml contains a client secret: keep it out of version control
# (it is in .gitignore) and readable only by the account running Sallyport.

# DNS: both <domain> and authenticate.<domain> must resolve to this server, and
# ports 80 and 443 must be reachable from the internet for Let's Encrypt.
domain: access.client.example
acme_email: ops@msp.example
# Use Let's Encrypt's staging CA until everything works (staging certificates are
# not trusted by browsers). Set to false for real certificates.
acme_staging: true

# Identity provider. provider is one of:
#   oidc    any OpenID Connect provider (the default): set issuer
#   auth0   Auth0: set domain (for example example.eu.auth0.com) instead of issuer; groups come from
#           a login Action that adds the pomerium.io/groups claim (see the GUI's setup help)
#   google  Google: no group support; list people under access.emails
# For the generic provider this is the MSP's IdP, e.g. Entra ID or Okta.
# Register this redirect URI with the IdP:
#   https://authenticate.<domain>/oauth2/callback
idp:
  provider: oidc
  issuer: https://login.example.com/tenant-id/v2.0
  client_id: 00000000-0000-0000-0000-000000000000
  client_secret: change-me
  scopes: [openid, profile, email]

# Who may reach Sallyport at all. This is a gate in front of Guacamole, separate from which
# systems each person sees (targets.yaml). Emails, groups and domains are alternatives: matching
# any one admits the person. If you list NONE of them, anyone your identity provider
# authenticates is admitted. That is fine when the identity provider's own application for
# Sallyport restricts who can sign in (for Auth0 you must configure that; it is not the default).
# It is refused for providers that authenticate the general public (Google, Microsoft "common").
# Anyone admitted who has no login of their own sees only the logins marked "everyone".
access:
  # Exact email addresses (as the IdP asserts them).
  emails:
    - alice@msp.example
  # Group membership, matched against a claim in the ID token. Use immutable
  # group IDs, not display names. The IdP must be configured to emit the claim.
  # Removal from a group takes effect when the user's session ends or they sign
  # in again, so keep session.lifetime short.
  groups: []
  groups_claim: groups
  # Email domains, for example example.com.
  domains: []

session:
  lifetime: 8h # how long a login lasts before the user must sign in again
  idle_timeout: 30m

# No domain of your own? Use a free DuckDNS name instead of `domain:` (see README). Sallyport then
# runs a container that keeps it pointed at this server.
# dynamic_dns:
#   provider: duckdns
#   subdomain: myfirm
#   token: your-duckdns-token

# Who may open the admin site (https://admin.<domain>), where systems, people, groups and
# logins are managed. It has its own allow-list; leave both empty to turn it off.
# Needs a DNS record for admin.<domain> like the main one.
admin:
  emails:
    - alice@msp.example
  groups: []

# Optional unattended nightly update. Quote the time: an unquoted 03:00 is a number in some YAML readers.
# Apply with: ./sallyport schedule apply   (read the README section on the risks first)
# updates:
#   schedule: "03:00"
#   critical: true   # also check hourly for an update flagged critical upstream and apply it at once
